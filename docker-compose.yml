services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - tijori_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Reserved for session/rate-limit caching; the app runs fine without it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      REDIS_URL: redis://redis:6379
      # SMS_WEBHOOK_URL: https://your-sms-gateway.example/send   # optional, for real OTP SMS
    ports:
      - "3000:3000"

volumes:
  tijori_pgdata:
